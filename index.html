<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>쇼핑 리스트</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    body {
      font-family: "Segoe UI", "Malgun Gothic", sans-serif;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: flex-start;
      padding: 40px 16px;
    }
    .app {
      background: #fff;
      width: 100%;
      max-width: 460px;
      border-radius: 16px;
      box-shadow: 0 12px 40px rgba(0, 0, 0, 0.2);
      overflow: hidden;
    }
    header {
      padding: 24px;
      background: #5b4ba8;
      color: #fff;
    }
    header h1 {
      font-size: 22px;
      display: flex;
      align-items: center;
      gap: 8px;
    }
    header p {
      margin-top: 4px;
      font-size: 13px;
      opacity: 0.8;
    }

    /* [Fix 1] localStorage 미지원 알림 */
    .no-storage-banner {
      background: #fff3cd;
      color: #856404;
      font-size: 13px;
      padding: 8px 24px;
      border-bottom: 1px solid #ffc107;
    }

    .input-row {
      display: flex;
      gap: 8px;
      padding: 16px 24px;
      border-bottom: 1px solid #eee;
    }
    .input-row input {
      flex: 1;
      padding: 12px 14px;
      border: 1px solid #ddd;
      border-radius: 8px;
      font-size: 15px;
      /* [Fix 2] outline:none 제거 — :focus-visible 로 대체 */
    }
    /* [Fix 2] 키보드 포커스 시에만 외곽선 표시 */
    .input-row input:focus-visible {
      outline: 2px solid #5b4ba8;
      outline-offset: 0;
      border-color: #5b4ba8;
    }
    .input-row button {
      padding: 0 18px;
      border: none;
      border-radius: 8px;
      background: #5b4ba8;
      color: #fff;
      font-size: 15px;
      font-weight: 600;
      cursor: pointer;
      transition: background 0.15s;
    }
    .input-row button:hover {
      background: #4a3d8f;
    }
    /* [Fix 2] 모든 버튼 키보드 포커스 스타일 */
    button:focus-visible {
      outline: 2px solid #5b4ba8;
      outline-offset: 2px;
    }
    ul.list {
      list-style: none;
      padding: 8px 0;
      min-height: 80px;
    }
    li.item {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 12px 24px;
      transition: background 0.1s;
    }
    li.item:hover {
      background: #f7f6fb;
    }
    li.item input[type="checkbox"] {
      width: 20px;
      height: 20px;
      cursor: pointer;
      accent-color: #5b4ba8;
      flex-shrink: 0;
    }
    /* [Fix 4] label 요소도 동일한 스타일 적용 */
    li.item label.label {
      flex: 1;
      font-size: 16px;
      color: #333;
      word-break: break-all;
      cursor: pointer;
    }
    li.item.checked label.label {
      text-decoration: line-through;
      color: #aaa;
    }
    li.item .delete {
      border: none;
      background: transparent;
      color: #d9534f;
      font-size: 18px;
      cursor: pointer;
      padding: 4px 8px;
      border-radius: 6px;
      flex-shrink: 0;
    }
    li.item .delete:hover {
      background: #fdecea;
    }
    .empty {
      text-align: center;
      color: #bbb;
      padding: 32px 24px;
      font-size: 14px;
    }
    footer {
      padding: 14px 24px;
      border-top: 1px solid #eee;
      font-size: 13px;
      color: #888;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    footer button {
      border: none;
      background: transparent;
      color: #5b4ba8;
      cursor: pointer;
      font-size: 13px;
    }
    footer button:hover {
      text-decoration: underline;
    }
  </style>
</head>
<body>
  <div class="app">
    <header>
      <h1>🛒 쇼핑 리스트</h1>
      <p>장 볼 항목을 추가하고 체크하세요</p>
    </header>

    <!-- [Fix 1] localStorage 미지원 안내 (JS에서 조건부 표시) -->
    <div class="no-storage-banner" id="noStorageBanner" hidden>
      저장 기능을 사용할 수 없습니다 (사생활 보호 모드). 목록이 유지되지 않습니다.
    </div>

    <div class="input-row">
      <input id="itemInput" type="text" placeholder="예: 우유, 계란..." autocomplete="off" />
      <button id="addBtn">추가</button>
    </div>

    <ul class="list" id="list" role="list"></ul>

    <footer>
      <span id="count" aria-live="polite">0개 항목</span>
      <button id="clearBtn">전체 삭제</button>
    </footer>
  </div>

  <script>
    // [Fix 1] MDN 권고 방식의 localStorage 가용성 검사
    function storageAvailable() {
      try {
        const x = "__storage_test__";
        localStorage.setItem(x, x);
        localStorage.removeItem(x);
        return true;
      } catch (e) {
        return (
          e instanceof DOMException &&
          e.name === "QuotaExceededError" &&
          localStorage &&
          localStorage.length !== 0
        );
      }
    }

    const canStore = storageAvailable();
    if (!canStore) {
      document.getElementById("noStorageBanner").hidden = false;
    }

    const STORAGE_KEY = "shopping-list-items";
    let items = canStore
      ? JSON.parse(localStorage.getItem(STORAGE_KEY) || "[]")
      : [];

    const listEl = document.getElementById("list");
    const inputEl = document.getElementById("itemInput");
    const addBtn = document.getElementById("addBtn");
    const clearBtn = document.getElementById("clearBtn");
    const countEl = document.getElementById("count");

    function save() {
      if (canStore) {
        localStorage.setItem(STORAGE_KEY, JSON.stringify(items));
      }
    }

    function render() {
      listEl.innerHTML = "";

      if (items.length === 0) {
        const empty = document.createElement("div");
        empty.className = "empty";
        empty.textContent = "항목이 없습니다. 위에서 추가해 보세요!";
        listEl.appendChild(empty);
      } else {
        items.forEach((item) => {
          const li = document.createElement("li");
          li.className = "item" + (item.checked ? " checked" : "");

          // [Fix 4] checkbox에 고유 id 부여
          const checkboxId = `item-${item.id}`;

          const checkbox = document.createElement("input");
          checkbox.type = "checkbox";
          checkbox.id = checkboxId;
          checkbox.checked = item.checked;
          checkbox.addEventListener("change", () => toggle(item.id));

          // [Fix 4] <span> → <label for="..."> 로 교체해 체크박스와 연결
          const label = document.createElement("label");
          label.htmlFor = checkboxId;
          label.className = "label";
          label.textContent = item.text;

          const del = document.createElement("button");
          del.className = "delete";
          del.textContent = "✕";
          // [Fix 5] 스크린 리더용 aria-label 추가
          del.setAttribute("aria-label", `${item.text} 삭제`);
          del.addEventListener("click", () => remove(item.id));

          li.appendChild(checkbox);
          li.appendChild(label);
          li.appendChild(del);
          listEl.appendChild(li);
        });
      }

      const remaining = items.filter((i) => !i.checked).length;
      countEl.textContent = `${items.length}개 항목 · ${remaining}개 남음`;
    }

    function addItem() {
      const text = inputEl.value.trim();
      if (!text) return;
      // [Fix 3] Date.now() + Math.random() → crypto.randomUUID()
      items.push({ id: crypto.randomUUID(), text, checked: false });
      inputEl.value = "";
      inputEl.focus();
      save();
      render();
    }

    function toggle(id) {
      const item = items.find((i) => i.id === id);
      if (item) item.checked = !item.checked;
      save();
      render();
    }

    function remove(id) {
      items = items.filter((i) => i.id !== id);
      save();
      render();
    }

    addBtn.addEventListener("click", addItem);
    inputEl.addEventListener("keydown", (e) => {
      if (e.key === "Enter") addItem();
    });
    clearBtn.addEventListener("click", () => {
      if (items.length && confirm("모든 항목을 삭제할까요?")) {
        items = [];
        save();
        render();
      }
    });

    render();
  </script>
</body>
</html>
